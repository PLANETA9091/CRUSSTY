[package]
name = "crussty"
version = "0.1.0"
edition = "2021"
description = "Crussty CE native surface as a c-plugin: injects the full JNI bridge (283 natives) into any Paper-family kernel"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
cplug-abi = { path = "../../cplug-abi" }
cplug-sdk = { path = "../../cplug-sdk" }
jvmti-bindings = "2"
libloading = "0.8"
