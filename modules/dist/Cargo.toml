[package]
name = "dist"
version = "0.1.0"
edition = "2021"
description = "The v1 dist engine (crates/mod-native + dist-paper logic) as a c-plugin: UDP leases, fencing, heartbeat/commit driven from the kernel's own main thread"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
cplug-abi = { path = "../../cplug-abi" }
cplug-sdk = { path = "../../cplug-sdk" }
jvmti-bindings = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
