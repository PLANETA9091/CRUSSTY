[package]
name = "crussty-cli"
version = "0.1.0"
edition = "2021"
description = "crussty — CLI for Crussty server builders and module developers"

[[bin]]
name = "crussty"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["_tls"] }
flate2 = "1"
tar = "0.4"