name: publish-npm

on:
  push:
    branches: ["master"]
    tags: ["cli-*"]
    paths:
      - "cli/**"
      - "!cli/npm/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            pkg: crussty-linux-x64
            tag: linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            pkg: crussty-linux-arm64
            tag: linux-arm64
          - os: macos-latest
            arch: arm64
            pkg: crussty-darwin-arm64
            tag: darwin-arm64
          - os: windows-latest
            arch: x64
            pkg: crussty-windows-x64
            tag: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build
        working-directory: cli
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: |
            cli/target/release/crussty
            cli/target/release/crussty.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Stage binaries into platform packages
        run: |
          for d in dist/*/; do
            pkg=$(basename "$d")
            tag=${pkg#crussty-}
            mkdir -p "cli/npm/pkg/$tag/bin"
            cp "$d"/crussty* "cli/npm/pkg/$tag/bin/"
            chmod +x "cli/npm/pkg/$tag/bin/"crussty*
          done
      - name: Authenticate to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      - name: Bump versions (patch over the published version)
        run: |
          set -e
          bump() {
            dir=$1; pkg=$2
            cur=$(npm view "$pkg" version 2>/dev/null || node -p "require('./$dir/package.json').version")
            new=$(node -e "const [m,i,p]=process.argv[1].split('.');console.log(m+'.'+i+'.'+(+p+1))" "$cur")
            (cd "$dir" && npm pkg set version="$new")
            echo "$pkg: $cur -> $new"
          }
          for tag in linux-x64 linux-arm64 darwin-arm64 windows-x64; do
            bump "cli/npm/pkg/$tag" "crussty-$tag"
          done
          PLATFORM_VERSION=$(node -p "require('./cli/npm/pkg/linux-x64/package.json').version")
          bump "cli/npm" "crussty"
          for tag in linux-x64 linux-arm64 darwin-arm64 windows-x64; do
            (cd cli/npm && npm pkg set "optionalDependencies.crussty-$tag=$PLATFORM_VERSION")
          done
          echo "platform deps pinned to $PLATFORM_VERSION"
          echo "PLATFORM_VERSION=$PLATFORM_VERSION" >> "$GITHUB_ENV"
      - name: Publish platform packages
        run: |
          for tag in linux-x64 linux-arm64 darwin-arm64 windows-x64; do
            (cd "cli/npm/pkg/$tag" && npm publish --access public)
          done
      - name: Publish main package
        working-directory: cli/npm
        run: npm publish --access public