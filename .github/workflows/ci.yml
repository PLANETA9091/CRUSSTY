name: CI
on:
  push:
    branches: ["master", "gh-pages"]
  pull_request:

jobs:
  crates:
    name: build+test ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - cplug-abi
          - cplug-sdk
          - runtime
          - modules/hello
          - modules/dist
          - modules/crussty
          - modules/cells
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Cargo build
        run: cargo build --manifest-path ${{ matrix.crate }}/Cargo.toml
      - name: Cargo test
        run: cargo test --manifest-path ${{ matrix.crate }}/Cargo.toml

  helpers:
    name: Java helper artifacts in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Rebuild helpers
        run: bash scripts/build-helpers.sh
      - name: JNI bridge table in sync with manifest
        run: python3 scripts/gen_crussty_table.py render --check
      - name: Verify committed artifacts unchanged
        run: |
          if ! git diff --quiet --exit-code cplug-sdk/asm-build modules/crussty/area-map/build modules/crussty/noise/build modules/dist/build; then
            echo "::error::Java helper .class artifacts are out of sync with sources. Run scripts/build-helpers.sh and commit the result."
            git diff --stat cplug-sdk/asm-build modules/crussty/area-map/build modules/crussty/noise/build modules/dist/build
            exit 1
          fi
          echo "OK: committed artifacts are up to date"

  docs:
    name: mdbook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook 0.4
        run: |
          curl -sL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv mdbook /usr/local/bin/mdbook
          mdbook --version
      - name: Build book
        run: mdbook build book

  multilang:
    name: build examples-multilang (c/cpp/go/js/python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ python3 golang-go
      - name: Build every language example
        run: |
          cd modules/examples-multilang
          for lang in c cpp go js python; do
            echo "== building $lang =="
            bash $lang/build.sh
            ls -1 "$lang"/lib*.so >/dev/null || { echo "::error::$lang build produced no lib*.so"; exit 1; }
          done
  cli:
    name: cli build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --manifest-path cli/Cargo.toml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crussty-${{ matrix.arch }}
          path: cli/target/release/crussty${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
