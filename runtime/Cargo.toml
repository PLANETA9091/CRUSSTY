[package]
name = "crussty-runtime"
version = "2.0.0"
edition = "2021"
description = "Native injection engine: loads modules into the kernel JVM"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cplug-abi = { path = "../cplug-abi" }
jvmti-bindings = "2"
jni = "0.22"
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

# TASK-213 codegen audit: default release profile splits the crate into 16
# CGUs, blocking cross-module inlining on the hot chains (c_bridge -> events,
# telemetry -> events, scheduler). One unit lets LLVM see every call site.
[profile.release]
codegen-units = 1
lto = "fat"
