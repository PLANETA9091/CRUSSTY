[package]
name = "crussty-runtime"
version = "2.0.0"
edition = "2021"
description = "Native injection engine: loads modules into the kernel JVM"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
cplug-abi = { path = "../cplug-abi" }
jvmti-bindings = "2"
libloading = "0.8"
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
